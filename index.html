<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医学刷题</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #1f4e79;
    }

    .progress {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .question {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      text-align: left;
      font-size: 17px;
    }

    .option:active {
      background: #eef5ff;
    }

    .correct {
      background: #dff5e3 !important;
      border-color: #4caf50;
    }

    .wrong {
      background: #ffe3e3 !important;
      border-color: #e53935;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      line-height: 1.6;
    }

    #next {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-size: 17px;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>📚 医学刷题</h1>

  <div class="progress" id="progress"></div>

  <div class="card">

    <div class="question" id="question"></div>

    <div id="options"></div>

    <div id="result"></div>

    <button id="next" onclick="nextQuestion()">
      下一题 →
    </button>

  </div>

</div>

<script>

const questions = [

  {
    question: "HER2阳性乳腺癌新辅助治疗后的病理完全缓解通常缩写为什么？",
    options: [
      "pCR",
      "DFS",
      "OS",
      "ORR"
    ],
    answer: 0,
    explanation: "pCR是pathological complete response，即病理完全缓解。"
  },

  {
    question: "TNBC是下列哪种乳腺癌的英文缩写？",
    options: [
      "三阴性乳腺癌",
      "HER2阳性乳腺癌",
      "Luminal A型乳腺癌",
      "导管原位癌"
    ],
    answer: 0,
    explanation: "TNBC是triple-negative breast cancer，即三阴性乳腺癌。"
  },

  {
    question: "乳腺癌中HER2的中文名称通常是？",
    options: [
      "雌激素受体",
      "孕激素受体",
      "人表皮生长因子受体2",
      "血管内皮生长因子"
    ],
    answer: 2,
    explanation: "HER2即human epidermal growth factor receptor 2，人表皮生长因子受体2。"
  }

];

let current = 0;

function loadQuestion() {

  const q = questions[current];

  document.getElementById("progress").innerText =
    "第 " + (current + 1) + " / " + questions.length + " 题";

  document.getElementById("question").innerText =
    (current + 1) + ". " + q.question;

  const optionsDiv = document.getElementById("options");

  optionsDiv.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.innerText =
      String.fromCharCode(65 + index) + ". " + option;

    button.onclick = () => checkAnswer(index, button);

    optionsDiv.appendChild(button);

  });

  document.getElementById("result").style.display = "none";
  document.getElementById("next").style.display = "none";
}

function checkAnswer(index, button) {

  const q = questions[current];

  const buttons = document.querySelectorAll(".option");

  buttons.forEach(btn => btn.disabled = true);

  if(index === q.answer) {

    button.classList.add("correct");

  } else {

    button.classList.add("wrong");

    buttons[q.answer].classList.add("correct");

  }

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML =
    "<strong>" +
    (index === q.answer ? "✅ 回答正确" : "❌ 回答错误") +
    "</strong><br><br>" +
    "<strong>正确答案：</strong>" +
    String.fromCharCode(65 + q.answer) +
    "<br><br>" +
    "<strong>解析：</strong>" +
    q.explanation;

  document.getElementById("next").style.display = "block";
}

function nextQuestion() {

  current++;

  if(current >= questions.length) {

    alert("🎉 本组题目已经完成！");

    current = 0;

  }

  loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
