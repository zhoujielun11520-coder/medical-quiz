<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学刷题</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  background: #f5f7fa;
  color: #222;
}

.app {
  max-width: 650px;
  margin: auto;
  padding: 22px;
}

.header {
  text-align: center;
  margin: 30px 0;
}

.header h1 {
  color: #145b87;
  font-size: 32px;
  margin-bottom: 10px;
}

.chapter {
  color: #777;
  margin-bottom: 8px;
}

.progress {
  color: #666;
  font-size: 17px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.question {
  font-size: 21px;
  line-height: 1.7;
  margin-bottom: 25px;
}

.option {
  display: block;
  width: 100%;
  background: white;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 17px;
  margin: 12px 0;
  text-align: left;
  font-size: 18px;
  line-height: 1.5;
}

.correct {
  background: #dff6e5 !important;
  border: 2px solid #34b65a !important;
}

.wrong {
  background: #ffe3e3 !important;
  border: 2px solid #e34b4b !important;
}

.result {
  display: none;
  margin-top: 25px;
  padding: 18px;
  background: #f7f9fc;
  border-radius: 12px;
  line-height: 1.7;
  font-size: 17px;
}

.next {
  display: none;
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #1769aa;
  color: white;
  font-size: 18px;
}

.stats {
  text-align: center;
  margin-top: 20px;
  color: #666;
  line-height: 1.8;
}

.finish {
  text-align: center;
  padding: 30px 10px;
}

.restart {
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  background: #1769aa;
  color: white;
  font-size: 17px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>📚 医学刷题</h1>
    <div class="chapter" id="chapter"></div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="card" id="card">

    <div class="question" id="question"></div>

    <div id="options"></div>

    <div class="result" id="result"></div>

    <button class="next" id="next" onclick="nextQuestion()">
      下一题 →
    </button>

  </div>

  <div class="stats" id="stats"></div>

</div>

<!-- 读取独立题库 -->
<script src="questions.js"></script>

<script>

let current = 0;
let correctCount = 0;
let wrongCount = 0;

function loadQuestion() {

  const q = questions[current];

  document.getElementById("chapter").innerText =
    q.subject + " · " + q.chapter;

  document.getElementById("progress").innerText =
    "第 " + (current + 1) + " / " + questions.length + " 题";

  document.getElementById("question").innerText =
    (current + 1) + ". " + q.question;

  const optionsDiv = document.getElementById("options");

  optionsDiv.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.innerText =
      String.fromCharCode(65 + index) + ". " + option;

    button.onclick = function() {
      checkAnswer(index, button);
    };

    optionsDiv.appendChild(button);

  });

  document.getElementById("result").style.display = "none";
  document.getElementById("next").style.display = "none";

  updateStats();
}


function checkAnswer(index, selectedButton) {

  const q = questions[current];

  const buttons = document.querySelectorAll(".option");

  buttons.forEach(function(button) {
    button.disabled = true;
  });

  const correct = index === q.answer;

  if (correct) {

    selectedButton.classList.add("correct");

    correctCount++;

  } else {

    selectedButton.classList.add("wrong");

    buttons[q.answer].classList.add("correct");

    wrongCount++;

  }

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML =
    "<strong>" +
    (correct ? "✅ 回答正确" : "❌ 回答错误") +
    "</strong><br><br>" +

    "<strong>正确答案：</strong>" +
    String.fromCharCode(65 + q.answer) +

    "<br><br><strong>解析：</strong><br>" +
    q.explanation;

  document.getElementById("next").style.display = "block";

  updateStats();
}


function nextQuestion() {

  current++;

  if (current >= questions.length) {

    showFinish();

    return;
  }

  loadQuestion();
}


function updateStats() {

  const answered = correctCount + wrongCount;

  let accuracy = 0;

  if (answered > 0) {
    accuracy = Math.round(correctCount / answered * 100);
  }

  document.getElementById("stats").innerHTML =
    "已做：" + answered +
    "　✅ 正确：" + correctCount +
    "　❌ 错误：" + wrongCount +
    "<br>正确率：" + accuracy + "%";
}


function showFinish() {

  const answered = correctCount + wrongCount;

  let accuracy = 0;

  if (answered > 0) {
    accuracy = Math.round(correctCount / answered * 100);
  }

  document.getElementById("chapter").innerText = "";

  document.getElementById("progress").innerText =
    "本组刷题完成";

  document.getElementById("card").innerHTML =
    '<div class="finish">' +

    '<h2>🎉 刷题完成</h2>' +

    '<p>共完成 ' + answered + ' 道题</p>' +

    '<p>✅ 正确：' + correctCount + '</p>' +

    '<p>❌ 错误：' + wrongCount + '</p>' +

    '<p><strong>正确率：' + accuracy + '%</strong></p>' +

    '<button class="restart" onclick="location.reload()">' +
    '重新刷题' +
    '</button>' +

    '</div>';
}

loadQuestion();

</script>

</body>
</html>
